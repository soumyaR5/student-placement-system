spring.application.name=student-placement-system
server.port=${SERVER_PORT:8080}

# Loads variables from a local .env file (if present) in the working directory.
# Real environment variables always work too. Never commit the .env file.
spring.config.import=optional:file:.env[.properties]

# Database credentials come ONLY from the environment (no defaults for user/password).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:student_placement_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seed sample data on first start (only when tables are empty)
app.seed.enabled=${APP_SEED_ENABLED:true}
